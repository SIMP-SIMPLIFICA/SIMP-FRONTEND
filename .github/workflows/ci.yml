name: CI — Validator + Test + Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # AGENT 1: Validator — lint + typecheck
  # ─────────────────────────────────────────────
  validate:
    name: Validator Agent (lint + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────
  # AGENT 2: Test + Coverage
  # ─────────────────────────────────────────────
  test:
    name: Test Agent (unit + hooks + coverage)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # AGENT 3: Build check
  # Garante que o build de produção não quebra
  # ─────────────────────────────────────────────
  build:
    name: Build Agent
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-frontend
          path: dist/
          retention-days: 3
