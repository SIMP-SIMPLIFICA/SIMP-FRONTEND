version: 2
updates:
  # Mantém as GitHub Actions atualizadas automaticamente
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"

  # Mantém as dependências npm atualizadas
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # React 19 é recente — não atualizar automaticamente para major
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # shadcn/ui / Radix: podem ter breaking changes visuais
      - dependency-name: "@radix-ui/*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
